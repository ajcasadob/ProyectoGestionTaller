<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Taller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card shadow-lg">
                    <div class="card-header bg-warning text-dark">
                        <h3 class="mb-0">
                            <i class="bi bi-pencil-square"></i> Editar Taller
                        </h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/taller/actualizar}" th:object="${taller}" method="post">

                            <!-- ID (oculto) -->
                            <input type="hidden" th:field="*{id}">

                            <!-- Nombre del Taller -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold">
                                    <i class="bi bi-building"></i> Nombre del Taller
                                </label>
                                <input type="text" class="form-control form-control-lg" id="nombre" th:field="*{nombre}"
                                    placeholder="Nombre del taller">
                            </div>

                            <!-- Dirección -->
                            <div class="mb-3">
                                <label for="direccion" class="form-label fw-bold">
                                    <i class="bi bi-geo-alt-fill"></i> Dirección
                                </label>
                                <input type="text" class="form-control" id="direccion" th:field="*{direccion}"
                                    placeholder="Dirección completa">
                            </div>

                            <!-- NIF -->
                            <div class="mb-3">
                                <label for="nif" class="form-label fw-bold">
                                    <i class="bi bi-card-text"></i> NIF/CIF
                                </label>
                                <input type="text" class="form-control" id="nif" th:field="*{nif}"
                                    placeholder="NIF/CIF">
                            </div>

                            <!-- Horario -->
                            <div class="mb-3">
                                <label for="horario" class="form-label fw-bold">
                                    <i class="bi bi-clock"></i> Horario
                                </label>
                                <input type="text" class="form-control" id="horario" th:field="*{horario}"
                                    placeholder="Horario de atención">
                            </div>

                            <!-- Fecha de Creación -->
                            <div class="mb-4">
                                <label for="fechaCreacion" class="form-label fw-bold">
                                    <i class="bi bi-calendar-check"></i> Fecha de Creación
                                </label>
                                <input type="date" class="form-control" id="fechaCreacion" th:field="*{fechaCreacion}">
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-warning btn-lg text-dark">
                                    <i class="bi bi-check-circle"></i> Actualizar Taller
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
