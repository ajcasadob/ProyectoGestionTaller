<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>AutoService Pro — Formulario Coche</title>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Bootstrap Icons -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
	<div class="container py-4">
		<div class="row justify-content-center">
			<div class="col-12 col-md-8">
				<div class="card shadow-sm">
					<div class="card-body">
						<div class="d-flex justify-content-between align-items-center mb-3">
							<div>
								<h5 class="mb-0" th:text="${coche != null and coche.id != null} ? 'Editar Coche' : 'Nuevo Coche'">Nuevo Coche</h5>
								<small class="text-muted">Rellena los datos del vehículo</small>
							</div>
							<a th:href="@{/coches}" class="btn btn-sm btn-outline-secondary">Volver</a>
						</div>

						<!-- Formulario -->
						<!-- Enviar siempre a /coches/nuevo (el controller maneja crear/actualizar según el id en el objeto) -->
						<form th:object="${coche}" th:action="@{/coches/nuevo}" method="post">

							<div class="mb-3">
								<label class="form-label">Matrícula</label>
								<input type="text" th:field="*{matricula}" class="form-control" placeholder="ABC-123" required />
								<div class="text-danger small" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}"></div>
							</div>

							<div class="row">
								<div class="col-md-6 mb-3">
									<label class="form-label">Marca</label>
									<input type="text" th:field="*{marca}" class="form-control" placeholder="Toyota" />
								</div>
								<div class="col-md-6 mb-3">
									<label class="form-label">Modelo</label>
									<input type="text" th:field="*{modelo}" class="form-control" placeholder="Corolla" />
								</div>
							</div>

							<div class="mb-3">
								<label class="form-label">KMs</label>
								<input type="number" step="0.1" th:field="*{kms}" class="form-control" placeholder="0" />
							</div>

							<div class="mb-3">
								<label class="form-label">Imagen (URL)</label>
								<input type="url" th:field="*{imagenUrl}" class="form-control" placeholder="https://..." />
							</div>

							<div class="mb-3">
								<label class="form-label">Problema</label>
								<textarea th:field="*{problema}" class="form-control" rows="3" placeholder="Describe el problema"></textarea>
							</div>

							<div class="mb-3">
								<label class="form-label">Cliente (opcional)</label>
								<select th:field="*{cliente.id}" class="form-select">
									<option value="">-- Sin cliente --</option>
									<option th:each="cliente : ${clientes}"
											th:value="${cliente.id}"
											th:text="${cliente.nombre} + ' ' + cliente.apellidos">
									</option>
								</select>
								<div class="text-muted small mt-1">Si no hay clientes en el modelo, la lista aparecerá vacía.</div>
							</div>

							<div class="d-flex justify-content-end gap-2">
								<a th:href="@{/coches}" class="btn btn-outline-secondary">Cancelar</a>
								<button type="submit" class="btn btn-primary">Guardar</button>
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap JS (with Popper) -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
