<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Nueva Factura</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/facturas/guardar}" th:object="${factura}" method="post">

                            <!-- ID (oculto para edición) -->
                            <input type="hidden" th:field="*{id}">

                            <!-- Descripción -->
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"
                                    placeholder="Descripción del trabajo realizado" required></textarea>
                            </div>

                            <!-- Precio -->
                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio (€)</label>
                                <input type="number" class="form-control" id="precio" th:field="*{precio}" step="0.01"
                                    min="0" placeholder="0.00" required>
                            </div>

                            <!-- Ingresos Totales -->
                           
                            

                            <!-- Pieza -->
                            <div class="mb-3">
                                <label for="pieza" class="form-label">Pieza</label>
                                <input type="text" class="form-control" id="pieza" th:field="*{pieza}"
                                    placeholder="Nombre de la pieza reparada/cambiada" required>
                            </div>

                            <!-- Fecha -->
                            <div class="mb-3">
                                <label for="fecha" class="form-label">Fecha</label>
                                <input type="datetime-local" class="form-control" id="fecha" th:field="*{fecha}"
                                    required>
                            </div>

                            <!-- Cliente (select) -->
                            <div class="mb-3">
                                <label for="cliente" class="form-label">Cliente</label>
                                <select class="form-select" id="cliente" th:field="*{cliente.id}" required>
                                    <option value="">Seleccione un cliente</option>
                                    <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                                        th:text="${cliente.nombre}">
                                    </option>
                                </select>
                            </div>

                            <!-- Coche (select) -->
                            <div class="mb-3">
                                <label for="coche" class="form-label">Coche</label>
                                <select class="form-select" id="coche" th:field="*{coche.id}" required>
                                    <option value="">Seleccione un coche</option>
                                    <option th:each="coche : ${coches}" th:value="${coche.id}"
                                        th:text="${coche.marca + ' ' + coche.modelo}">
                                    </option>
                                </select>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/facturas}" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Guardar Factura
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
