<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoService Pro — Clientes</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <aside class="col-auto col-md-3 col-lg-2 px-3 bg-white vh-100 border-end">
            <div class="d-flex align-items-center py-4">
                <div class="bg-primary text-white rounded-3 d-inline-flex align-items-center justify-content-center me-3" style="width:46px;height:46px;">
                    <i class="bi bi-car-front-fill fs-5"></i>
                </div>
                <div>
                    <div class="fw-bold">AutoService Pro</div>
                    <small class="text-muted">Gestión de Taller</small>
                </div>
            </div>

            <nav class="nav flex-column">
                <a class="nav-link d-flex align-items-center rounded-3 active text-primary mb-1"  th:href="@{/clientes}">
                    <i class="bi bi-people me-2"></i> Clientes
                </a>
                <a class="nav-link d-flex align-items-center rounded-3 text-dark mb-1" th:href="@{/coches}">
                    <i class="bi bi-car-front me-2"></i> Coches
                </a>
                <a class="nav-link d-flex align-items-center rounded-3 text-dark mb-1" href="#">
                    <i class="bi bi-file-earmark-text me-2"></i> Facturas
                </a>
                <a class="nav-link d-flex align-items-center rounded-3 text-dark mb-1" href="#">
                    <i class="bi bi-gear me-2"></i> Taller
                </a>
            </nav>
        </aside>

        <!-- Main -->
        <main class="col py-4">
            <!-- Topbar -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-secondary d-lg-none" type="button" aria-label="menu">
                        <i class="bi bi-list"></i>
                    </button>
                    <div class="d-flex align-items-center text-muted">
                        <i class="bi bi-people fs-5 me-2"></i>
                        <span class="fs-6 fw-semibold">Clientes</span>
                    </div>
                </div>

                <div>
                    <a  class="btn btn-dark rounded-pill px-4">
                        <i class="bi bi-plus-lg me-2"></i> Nuevo Cliente
                    </a>
                </div>
            </div>

            <!-- Page title -->
            <section class="mb-4">
                <h1 class="h3 fw-bold mb-1">Gestión de Clientes</h1>
                <p class="text-muted mb-0">Administra los clientes del taller</p>
            </section>

            <!-- Card -->
            <section class="card rounded-3 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="mb-0">Lista de Clientes</h5>
                            <small class="text-muted" >3 clientes registrados</small>
                        </div>
                        
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="text-muted small">
                            <tr>
                                <th style="width:6%;">ID</th>
                                <th>Nombre</th>
                                <th style="width:18%;">DNI</th>
                                <th style="width:18%;">Teléfono</th>
                                <th style="width:10%;">Coches</th>
                                <th style="width:12%;">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- Iteración de clientes -->
                            <tr th:each="cliente, iterStat : ${clientes}">
                                <!-- si quieres mostrar el id real del cliente usa cliente.id, aquí mostramos índice+1 -->
                                <td class="text-muted" th:text="${cliente.id != null} ? ${cliente.id} : ${iterStat.index + 1}">1</td>

                                <td>
                      <span class="me-2 text-muted d-inline-block" style="width:20px;">
                        <i class="bi bi-person"></i>
                      </span>
                                    <span th:text="${cliente.nombre}"></span>
                                </td>

                                <td th:text="${cliente.dni}"></td>

                                <td>
                                    <i class="bi bi-telephone me-2 text-muted"></i>
                                    <span th:text="${cliente.telefono}"></span>
                                </td>

                                <td>
                                    <!-- Si Cliente tiene una propiedad 'coches' como List -> usamos #lists.size(cliente.coches)
                                         Si tiene un campo 'numeroCoches' usa ${cliente.numeroCoches} -->
                                    <span class="badge bg-light text-primary rounded-circle"
                                          th:text="${cliente.coches != null} ? ${#lists.size(cliente.coches)} : (${cliente.numeroCoches} ?: 0)"
                                          style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;">
                        2
                      </span>
                                </td>

                                <td>
                                    <!-- Enlace editar -->
                                    <a
                                       class="btn btn-sm btn-outline-secondary rounded-2 me-1" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <!-- Botón eliminar (form POST para CSRF-safe) -->
                                    <form th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}" method="post"
                                          th:onsubmit="return confirm('¿Eliminar cliente ' + ${cliente.nombre} + '?');"
                                          style="display:inline-block;">
                                        <!-- Si usas Spring Security, inyecta el token CSRF así -->
                                        <input type="hidden" />
                                        <button type="submit" class="btn btn-sm btn-outline-secondary rounded-2" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>

                            <!-- Mensaje cuando no hay clientes -->
                            <tr th:if="${#lists.isEmpty(clientes)}">
                                <td colspan="6" class="text-center text-muted">No hay clientes registrados.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </section>

        </main>
    </div>
</div>

<!-- Bootstrap JS (with Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
