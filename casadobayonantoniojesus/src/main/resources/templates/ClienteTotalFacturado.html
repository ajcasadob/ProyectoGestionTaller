<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Total facturado del cliente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h3 class="mb-0">
                        <i class="bi bi-person-circle me-2"></i>
                        Total facturado - <span th:text="${cliente.nombre}"></span>
                    </h3>
                    <small class="opacity-75">
                        <i class="bi bi-person-badge me-1"></i>
                        DNI: <span th:text="${cliente.dni}"></span>
                    </small>
                </div>

                <div class="card-body p-4">
                    <!-- Resumen visual con iconos -->
                    <div class="row g-4 mb-4">
                        <!-- Total SIN IVA -->
                        <div class="col-md-6">
                            <div class="card bg-light border-0 h-100">
                                <div class="card-body text-center p-4">
                                    <div class="mb-3">
                                        <i class="bi bi-receipt text-secondary" style="font-size: 2.5rem;"></i>
                                    </div>
                                    <h6 class="text-muted mb-3">Base Imponible (sin IVA)</h6>
                                    <h2 class="text-dark fw-bold mb-0"
                                        th:text="${#numbers.formatDecimal(totalSinIva, 1, 'POINT', 2, 'COMMA')} + ' €'">
                                        0,00 €
                                    </h2>
                                    <small class="text-muted">Precio sin impuestos</small>
                                </div>
                            </div>
                        </div>

                        <!-- Total CON IVA -->
                        <div class="col-md-6">
                            <div class="card bg-success bg-opacity-10 border-success h-100">
                                <div class="card-body text-center p-4">
                                    <div class="mb-3">
                                        <i class="bi bi-currency-euro text-success" style="font-size: 2.5rem;"></i>
                                    </div>
                                    <h6 class="text-muted mb-3">Total con IVA (21%)</h6>
                                    <h2 class="text-success fw-bold mb-0"
                                        th:text="${#numbers.formatDecimal(totalConIva, 1, 'POINT', 2, 'COMMA')} + ' €'">
                                        0,00 €
                                    </h2>
                                    <small class="text-muted">Precio final</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Desglose del IVA -->
                    <div class="alert alert-info d-flex align-items-center mb-4" role="alert">
                        <i class="bi bi-info-circle-fill fs-4 me-3"></i>
                        <div class="flex-grow-1">
                            <strong>IVA Aplicado (21%):</strong>
                            <span class="ms-2 fs-5 fw-bold"
                                  th:text="${#numbers.formatDecimal(totalConIva - totalSinIva, 1, 'POINT', 2, 'COMMA')} + ' €'">
                                0,00 €
                            </span>
                        </div>
                    </div>

                    <!-- Información adicional del cliente -->
                    <div class="card bg-light border-0 mb-3">
                        <div class="card-body">
                            <h6 class="text-muted mb-3">
                                <i class="bi bi-info-circle me-2"></i>
                                Información del Cliente
                            </h6>
                            <div class="row">
                                <div class="col-md-6 mb-2">
                                    <small class="text-muted">Nombre:</small>
                                    <p class="mb-0 fw-semibold" th:text="${cliente.nombre}">-</p>
                                </div>
                                <div class="col-md-6 mb-2">
                                    <small class="text-muted">DNI:</small>
                                    <p class="mb-0 fw-semibold" th:text="${cliente.dni}">-</p>
                                </div>
                                <div class="col-md-6 mb-2" th:if="${cliente.telefono}">
                                    <small class="text-muted">Teléfono:</small>
                                    <p class="mb-0 fw-semibold">
                                        <i class="bi bi-telephone me-1"></i>
                                        <span th:text="${cliente.telefono}">-</span>
                                    </p>
                                </div>
                                <div class="col-md-6 mb-2" th:if="${cliente.facturas}">
                                    <small class="text-muted">Número de facturas:</small>
                                    <p class="mb-0 fw-semibold">
                                        <span class="badge bg-primary rounded-pill"
                                              th:text="${#lists.size(cliente.facturas)}">0</span>
                                        facturas
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Botón de regreso -->
                    <div class="text-center">
                        <a th:href="@{/clientes}" class="btn btn-primary btn-lg px-5">
                            <i class="bi bi-arrow-left me-2"></i> Volver a Clientes
                        </a>
                    </div>
                </div>

                <div class="card-footer bg-white text-end small text-muted border-0 py-3">
                    <i class="bi bi-calendar-event me-2"></i>
                    Fecha de consulta: <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
