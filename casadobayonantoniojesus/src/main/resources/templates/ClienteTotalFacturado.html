<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Total facturado del cliente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">
                        Total facturado para <span th:text="${cliente.nombre}"></span>
                    </h3>
                </div>
                <div class="card-body text-center">
                    <p class="mb-3 fs-4">
                        <strong>Total:</strong>
                        <span class="badge bg-success fs-3" th:text="${totalFacturado} + ' €'"></span>
                    </p>
                    <a th:href="@{/clientes}" class="btn btn-outline-primary">
                        <i class="bi bi-arrow-left"></i> Volver a clientes
                    </a>
                </div>
                <div class="card-footer text-end small text-muted">
                    Fecha de consulta: <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
