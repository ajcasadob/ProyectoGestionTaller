<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoService Pro — Coches</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <aside class="col-auto col-md-3 col-lg-2 px-3 bg-white vh-100 border-end">
            <div class="d-flex align-items-center py-4">
                <div class="bg-primary text-white rounded-3 d-inline-flex align-items-center justify-content-center me-3" style="width:46px;height:46px;">
                    <i class="bi bi-car-front-fill fs-5"></i>
                </div>
                <div>
                    <div class="fw-bold">AutoService Pro</div>
                    <small class="text-muted">Gestión de Taller</small>
                </div>
            </div>

            <nav class="nav flex-column">
                <a class="nav-link d-flex align-items-center rounded-3 text-dark mb-1"  th:href="@{/clientes}">
                    <i class="bi bi-people me-2"></i> Clientes
                </a>
                <a class="nav-link d-flex align-items-center rounded-3 active text-primary mb-1" href="#" th:href="@{/coches}">
                    <i class="bi bi-car-front me-2"></i> Coches
                </a>
                <a class="nav-link d-flex align-items-center rounded-3 text-dark mb-1" href="#" th:href="@{/facturas}">
                    <i class="bi bi-file-earmark-text me-2"></i> Facturas
                </a>
                <a class="nav-link d-flex align-items-center rounded-3 text-dark mb-1" href="#" th:href="@{/taller}">
                    <i class="bi bi-gear me-2"></i> Taller
                </a>
            </nav>
        </aside>

        <!-- Main -->
        <main class="col py-4">
            <!-- Topbar -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-secondary d-lg-none" type="button" aria-label="menu">
                        <i class="bi bi-list"></i>
                    </button>
                    <div class="d-flex align-items-center text-muted">
                        <i class="bi bi-car-front fs-5 me-2"></i>
                        <span class="fs-6 fw-semibold">Coches</span>
                    </div>
                </div>

                <div>
                    <a  class="btn btn-dark rounded-pill px-4">
                        <i class="bi bi-plus-lg me-2"></i> Nuevo Coche
                    </a>
                </div>
            </div>

            <!-- Page title -->
            <section class="mb-4">
                <h1 class="h3 fw-bold mb-1">Gestión de Coches</h1>
                <p class="text-muted mb-0">Administra los vehículos del taller</p>
            </section>

            <!-- Card -->
            <section class="card rounded-3 shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="mb-0">Lista de Coches</h5>
                            <small class="text-muted" th:text="${#lists.size(coches)} + ' vehículos registrados'">4 vehículos registrados</small>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="text-muted small">
                            <tr>
                                <th>Matrícula</th>
                                <th>Marca / Modelo</th>
                                <th>KMs</th>
                                <th>Cliente</th>
                                <th>Problema</th>
                                <th>Facturas</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- Iteración de coches -->
                            <tr th:each="coche : ${coches}">
                                <td class="fw-semibold" th:text="${coche.matricula}"></td>

                                <td>
                                    <div class="fw-semibold" th:text="${coche.marca}"></div>
                                    <div class="text-muted small" th:text="${coche.modelo}"></div>
                                </td>

                                <!-- KMs: si quieres formatear con separador de miles en Thymeleaf puedes usar utilidades, aquí se muestra simple -->
                                <td th:text="${coche.kms} + ' km'"></td>

                                <td th:text="${coche.cliente != null ? coche.cliente.nombre : '—'}"></td>

                                <td>
                      <span class="text-warning d-inline-flex align-items-center">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>
                        <span th:text="${coche.problema}"></span>
                      </span>
                                </td>

                                <td>
                      <span class="badge bg-success text-white rounded-circle"
                            style="width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;"
                            >1</span>
                                </td>

                                <td>
                                    <a  class="btn btn-sm btn-outline-secondary rounded-2 me-1" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <form th:action="@{/coches/eliminar/{id}(id=${coche.id})}" method="post"style="display:inline-block;">
                                        
                                        <button onclick="return confirm ('¿Estas seguro que quieres eliminar este coche?')" class="btn btn-sm btn-outline-secondary rounded-2" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>

                            <!-- Mensaje cuando no hay coches -->
                            <tr th:if="${#lists.isEmpty(coches)}">
                                <td colspan="7" class="text-center text-muted">No hay coches registrados.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </section>

        </main>
    </div>
</div>

<!-- Bootstrap JS (with Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
