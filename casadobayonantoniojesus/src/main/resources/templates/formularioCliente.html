<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoService Pro — Formulario Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.4/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h5 class="mb-0" th:text="${cliente != null and cliente.id != null} ? 'Editar Cliente' : 'Nuevo Cliente'">Nuevo Cliente</h5>
                            <small class="text-muted">Rellena los datos del cliente</small>
                        </div>
                        <a th:href="@{/clientes}" class="btn btn-sm btn-outline-secondary">Volver</a>
                    </div>


                    <form th:object="${cliente}" th:action="@{/clientes/nuevo}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <!-- campos básicos -->
                        <div class="mb-3">
                            <label class="form-label">DNI</label>
                            <input type="text" th:field="*{dni}" class="form-control" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" th:field="*{telefono}" class="form-control" />
                        </div>

                        <!-- Select múltiple de coches (opcional) -->
                        <div class="mb-3">
                            <label class="form-label">Coches existentes (asignar al cliente)</label>
                            <select name="cocheIds" multiple class="form-select">
                                <option th:each="c : ${coches}" th:value="${c.id}"
                                        th:text="${c.matricula + ' — ' + c.marca + ' ' + c.modelo}"></option>
                            </select>
                            <div class="form-text">Mantén Ctrl/Cmd para seleccionar varios.</div>
                        </div>

                        <!-- Select múltiple de facturas (si Factura tiene cliente directo) -->
                        <div class="mb-3">
                            <label class="form-label">Facturas existentes (asignar al cliente)</label>
                            <select name="facturaIds" multiple class="form-select">
                                <option th:each="f : ${facturas}" th:value="${f.id}"
                                        th:text="${'#' + f.id + ' — ' + f.pieza + ' — ' + f.precio + ' €'}"></option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
